    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        background: #f0ece3;
        color: #1a1a1a;
        padding: 1.5rem 1rem 3rem;
      }

      .contenedor {
        max-width: 900px;
        margin: 0 auto;
      }

      .cabecera {
        text-align: center;
        margin-bottom: 1.25rem;
      }
      .cabecera h1 {
        font-size: 30px;
        font-weight: normal;
        color: #2c2c2c;
      }
      .cabecera p {
        font-family: Arial, sans-serif;
        font-size: 16px;
        color: #666;
        margin-top: 4px;
      }

      .panel {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 1rem;
      }
      .btn {
        font-family: Arial, sans-serif;
        font-size: 16px;
        padding: 12px 22px;
        border-radius: 10px;
        border: 1.5px solid #aaa;
        background: #fff;
        color: #1a1a1a;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover {
        background: #f0ede8;
      }
      .btn.primario {
        background: #2a7a5c;
        border-color: #2a7a5c;
        color: #fff;
      }
      .btn.primario:hover {
        background: #225f48;
      }
      .btn.nuevo {
        background: #8a5000;
        border-color: #8a5000;
        color: #fff;
      }
      .btn.nuevo:hover {
        background: #6e4000;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .clue-banner {
        background: #fff3d6;
        border: 1.5px solid #e0b04a;
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 1rem;
        font-size: 19px;
        line-height: 1.4;
        min-height: 28px;
        text-align: center;
      }
      .clue-banner b {
        font-family: Arial, sans-serif;
        color: #8a5000;
      }

      .info-tamano {
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #888;
        margin-bottom: 0.75rem;
      }

      .grid-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 1.5rem;
      }
      .grid {
        display: grid;
        gap: 2px;
        width: max-content;
        margin: 0 auto;
      }
      .celda {
        position: relative;
        width: 32px;
        height: 32px;
        background: #d8d2c2;
        border-radius: 3px;
      }
      .celda.blanca {
        background: #fff;
        border: 1px solid #b9b3a3;
      }
      .celda .num {
        position: absolute;
        top: 1px;
        left: 2px;
        font-family: Arial, sans-serif;
        font-size: 9px;
        color: #777;
        pointer-events: none;
        line-height: 1;
      }
      .celda input {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        text-align: center;
        font-family: Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        color: #1a1a1a;
        text-transform: uppercase;
        padding: 0;
        border-radius: 3px;
        outline: none;
        caret-color: transparent;
      }
      .celda.activa {
        background: #ffe9a8;
      }
      .celda.activa input {
        background: #ffe9a8;
      }
      .celda.foco input {
        background: #ffcf4d;
      }
      .celda.correcta input {
        background: #c8e6c9;
        color: #1a4a2e;
      }
      .celda.incorrecta input {
        background: #ffe0b2;
      }

      .clues-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .clues-col h2 {
        font-size: 20px;
        font-weight: normal;
        margin-bottom: 10px;
        border-bottom: 2px solid #2a7a5c;
        padding-bottom: 6px;
        color: #2a7a5c;
      }
      .clue-item {
        font-family: Arial, sans-serif;
        font-size: 15px;
        line-height: 1.4;
        padding: 8px 6px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 2px;
      }
      .clue-item:hover {
        background: #f0ede8;
      }
      .clue-item.resuelto {
        color: #1a6b45;
        text-decoration: line-through;
        opacity: 0.65;
      }
      .clue-item.seleccionado {
        background: #ffe9a8;
      }
      .clue-item b {
        font-family: Georgia, serif;
      }

      .resultado-card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 14px;
        padding: 2.5rem 2rem;
        text-align: center;
        display: none;
        margin-top: 1.5rem;
      }
      .resultado-card.show {
        display: block;
      }
      .resultado-card h2 {
        font-size: 26px;
        font-weight: normal;
        margin-bottom: 10px;
      }
      .resultado-card p {
        font-family: Arial, sans-serif;
        font-size: 17px;
        color: #555;
      }

      @media (max-width: 700px) {
        .clues-cols {
          grid-template-columns: 1fr;
        }
        .celda {
          width: 28px;
          height: 28px;
        }
        .celda input {
          font-size: 16px;
        }
      }
    </style>
  </head>

      <div class="cabecera">
        <h1>Crucigrama de Chile</h1>
        <p>Palabras de todos los días y del lenguaje chileno</p>
      </div>

      <div class="panel">
        <button class="btn primario" onclick="revisarTodo()">
          Revisar respuestas
        </button>
        <button class="btn" onclick="darPista()">Pista</button>
        <button class="btn" onclick="reiniciar()">Borrar respuestas</button>
        <button
          class="btn nuevo"
          id="btn-nuevo-puzzle"
          onclick="generarPuzzleNuevo()"
        >
          Generar puzzle nuevo
        </button>
      </div>

      <div class="info-tamano" id="info-tamano"></div>
      <div class="clue-banner" id="clue-banner">
        Toque una casilla o una pista para comenzar
      </div>

      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>

        ["INGENIERO", "Persona que diseña puentes, caminos o máquinas"],
        ["ARQUITECTO", "Persona que diseña casas y edificios"],
        ["ELECTRICISTA", "Persona que arregla los cables de la casa"],
        ["GASFITER", "Persona que arregla las cañerías"],
        ["MECANICO", "Persona que arregla los autos"],
        ["AGRICULTOR", "Persona que cultiva la tierra"],
        ["PESCADOR", "Persona que pesca en el mar o en el río"],
        ["MINERO", "Persona que trabaja extrayendo cobre de la mina"],
        ["CARPINTERO", "Persona que trabaja la madera"],
        ["CARABINERO", "Policía uniformado de Chile"],

        // --- deportes y entretenimiento ---
        ["FUTBOL", "Deporte que se juega con una pelota y dos arcos"],
        ["TENIS", "Deporte que se juega con raqueta"],
        ["NATACION", "Deporte que se practica en la piscina"],
        ["CICLISMO", "Deporte que se practica en bicicleta"],
        ["BASQUETBOL", "Deporte donde se encesta la pelota en un aro"],
        ["VOLEIBOL", "Deporte donde se pasa la pelota por sobre una red"],
        ["AJEDREZ", "Juego de mesa con torres, caballos y un rey"],
        ["NAIPE", "Se usa para jugar a las cartas"],
        ["PELOTA", "Objeto redondo para jugar muchos deportes"],
        ["CANCHA", "Lugar donde se juega un partido"],
        ["PISCINA", "Lugar para nadar y refrescarse"],
        ["GIMNASIO", "Lugar para hacer ejercicio"],
        ["BAILE", "Actividad de moverse al ritmo de la música"],
        ["PINTURA", "Actividad artística con pinceles y colores"],
        ["DIBUJO", "Se hace con lápiz sobre un papel"],
        ["TEJIDO", "Se hace con lana y agujas"],
        ["COSTURA", "Se hace con hilo y aguja para arreglar la ropa"],
        ["JARDINERIA", "Actividad de cuidar plantas y flores"],
      ];

      /* ============================================================
   MOTOR DEL CRUCIGRAMA (compartido por el puzzle inicial y los generados)
   ============================================================ */

      function celdasDe(w) {
        const cs = [];
        for (let i = 0; i < w.len; i++) {
          const r = w.fila + (w.dir === "V" ? i : 0);
          const c = w.col + (w.dir === "H" ? i : 0);
          cs.push([r, c]);
        }
        return cs;
      }

      function clave(r, c) {
        return r + "," + c;
      }

      /* ---- generador aleatorio ---- */
      function barajar(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      class ConstructorCrucigrama {
        constructor() {
          this.grid = {}; // "r,c" -> letra
          this.dirEn = {}; // "r,c" -> Set de direcciones
          this.words = []; // {texto,fila,col,dir,pista}
        }

        cabe(word, r, c, direction) {
          const n = word.length;
          const antes = direction === "H" ? clave(r, c - 1) : clave(r - 1, c);
          const despues = direction === "H" ? clave(r, c + n) : clave(r + n, c);
          if (this.grid[antes] !== undefined) return false;
          if (this.grid[despues] !== undefined) return false;

          for (let i = 0; i < n; i++) {
            const rr = r + (direction === "V" ? i : 0);
            const cc = c + (direction === "H" ? i : 0);
            const k = clave(rr, cc);
            const ch = word[i];
            if (this.grid[k] !== undefined) {
              if (this.grid[k] !== ch) return false;
              if (this.dirEn[k] && this.dirEn[k].has(direction)) return false;
            } else {
              if (direction === "H") {
                if (this.grid[clave(rr - 1, cc)] !== undefined) return false;
                if (this.grid[clave(rr + 1, cc)] !== undefined) return false;
              } else {
                if (this.grid[clave(rr, cc - 1)] !== undefined) return false;
                if (this.grid[clave(rr, cc + 1)] !== undefined) return false;
              }
            }
          }
          return true;
        }

        colocar(word, r, c, direction, pista) {
          const n = word.length;
          for (let i = 0; i < n; i++) {
            const rr = r + (direction === "V" ? i : 0);
            const cc = c + (direction === "H" ? i : 0);
            const k = clave(rr, cc);
            this.grid[k] = word[i];
            if (!this.dirEn[k]) this.dirEn[k] = new Set();
            this.dirEn[k].add(direction);
          }
          this.words.push({
            texto: word,
            fila: r,
            col: c,
            dir: direction,
            pista: pista,
            len: n,
          });
        }

        intentarColocarAuto(word, pista) {
          const candidatos = [];
          for (let i = 0; i < word.length; i++) {
            const ch = word[i];
            for (const k in this.grid) {
              if (this.grid[k] !== ch) continue;
              const [er, ec] = k.split(",").map(Number);
              const dirsExistentes = this.dirEn[k] || new Set();
              for (const nuevaDir of ["H", "V"]) {
                if (dirsExistentes.has(nuevaDir)) continue;
                const r = nuevaDir === "H" ? er : er - i;
                const c = nuevaDir === "H" ? ec - i : ec;
                if (this.cabe(word, r, c, nuevaDir)) {
                  candidatos.push([r, c, nuevaDir]);
                }
              }
            }
          }
          if (candidatos.length === 0) return false;
          const [r, c, d] =
            candidatos[Math.floor(Math.random() * candidatos.length)];
          this.colocar(word, r, c, d, pista);
          return true;
        }
      }

      function construirDataDesdeConstructor(cw) {
        const claves = Object.keys(cw.grid);
        const filasArr = claves.map((k) => Number(k.split(",")[0]));
        const colsArr = claves.map((k) => Number(k.split(",")[1]));
        const minr = Math.min(...filasArr),
          minc = Math.min(...colsArr);
        const maxr = Math.max(...filasArr),
          maxc = Math.max(...colsArr);

        const gridNorm = {};
        claves.forEach((k) => {
          const [r, c] = k.split(",").map(Number);
          gridNorm[clave(r - minr, c - minc)] = cw.grid[k];
        });

        const filas = maxr - minr + 1,
          cols = maxc - minc + 1;

        function tiene(r, c) {
          return gridNorm[clave(r, c)] !== undefined;
        }

        const starts = {};
        for (let r = 0; r < filas; r++) {
          for (let c = 0; c < cols; c++) {
            if (!tiene(r, c)) continue;
            const esAcross = !tiene(r, c - 1) && tiene(r, c + 1);
            const esDown = !tiene(r - 1, c) && tiene(r + 1, c);
            if (esAcross || esDown) starts[clave(r, c)] = true;
          }
        }
        const numeros = {};
        let n = 1;
        for (let r = 0; r < filas; r++) {
          for (let c = 0; c < cols; c++) {
            if (starts[clave(r, c)]) {
              numeros[clave(r, c)] = n;
              n++;
            }
          }
        }

        const clues_h = [],
          clues_v = [];
        cw.words.forEach((w) => {
          const r = w.fila - minr,
            c = w.col - minc;
          const num = numeros[clave(r, c)];
          const entry = {
            num,
            texto: w.texto,
            fila: r,
            col: c,
            dir: w.dir,
            pista: w.pista,
            len: w.len,
          };
          (w.dir === "H" ? clues_h : clues_v).push(entry);
        });
        clues_h.sort((a, b) => a.num - b.num);
        clues_v.sort((a, b) => a.num - b.num);

        return { filas, cols, grid: gridNorm, numeros, clues_h, clues_v };
      }

      window.ConstructorCrucigrama = ConstructorCrucigrama;
      window.BANCO_PALABRAS = BANCO_PALABRAS;

      function generarCrucigrama() {
        let mejor = null;
        for (let intento = 0; intento < 10; intento++) {
          const cw = new ConstructorCrucigrama();
          const barajado = barajar(BANCO_PALABRAS);
          // semilla: primera palabra larga (>=7) del mazo barajado, para buen anclaje
          let idxSemilla = barajado.findIndex((w) => w[0].length >= 7);
          if (idxSemilla < 0) idxSemilla = 0;
          const semilla = barajado[idxSemilla];
          cw.colocar(semilla[0], 0, 0, "H", semilla[1]);

          for (let i = 0; i < barajado.length; i++) {
            if (i === idxSemilla) continue;
            if (cw.words.length >= 34) break; // limite razonable de palabras
            cw.intentarColocarAuto(barajado[i][0], barajado[i][1]);
          }

          if (!mejor || cw.words.length > mejor.words.length) mejor = cw;
          if (cw.words.length >= 24) break; // buen tamaño logrado, no seguir intentando
        }
        return construirDataDesdeConstructor(mejor);
      }

      /* ============================================================
   ESTADO Y RENDERIZADO DEL JUEGO
   ============================================================ */

      let DATA = null;
      let todasPalabras = [];
      let indice = {};
      let inputs = {};
      let direccionActual = "H";
      let palabraActual = null;
      let celdaActivaKey = null;

      function iniciarJuego(data) {
        DATA = data;
        DATA.clues_h.forEach((w) => (w.celdas = celdasDe(w)));
        DATA.clues_v.forEach((w) => (w.celdas = celdasDe(w)));
        todasPalabras = [...DATA.clues_h, ...DATA.clues_v];

        indice = {};
        todasPalabras.forEach((w) => {
          w.celdas.forEach(([r, c]) => {
            const k = clave(r, c);
            if (!indice[k]) indice[k] = {};
            indice[k][w.dir] = w;
          });
        });

        direccionActual = "H";
        palabraActual = null;
        celdaActivaKey = null;
        inputs = {};

        renderGrid();
        renderClues();

        document.getElementById("resultado").classList.remove("show");
        document.getElementById("clue-banner").textContent =
          "Toque una casilla o una pista para comenzar";
        document.getElementById("info-tamano").textContent =
          `${todasPalabras.length} palabras · grilla ${DATA.filas}×${DATA.cols}`;
        window.scrollTo({ top: 0, behavior: "smooth" });

        window.DATA = DATA;
        window.todasPalabras = todasPalabras;
        window.indice = indice;
        window.inputs = inputs;
      }

      function renderGrid() {
        const gridEl = document.getElementById("grid");
        gridEl.innerHTML = "";
        gridEl.style.gridTemplateColumns = `repeat(${DATA.cols}, 32px)`;
        gridEl.style.gridTemplateRows = `repeat(${DATA.filas}, 32px)`;

        for (let r = 0; r < DATA.filas; r++) {
          for (let c = 0; c < DATA.cols; c++) {
            const k = clave(r, c);
            const div = document.createElement("div");
            if (DATA.grid[k]) {
              div.className = "celda blanca";
              div.dataset.r = r;
              div.dataset.c = c;
              const num = DATA.numeros[k];
              if (num) {
                const spanNum = document.createElement("span");
                spanNum.className = "num";
                spanNum.textContent = num;
                div.appendChild(spanNum);
              }
              const input = document.createElement("input");
              input.maxLength = 1;
              input.dataset.r = r;
              input.dataset.c = c;
              input.autocomplete = "off";
              input.inputMode = "text";
              div.appendChild(input);
              inputs[k] = input;

              input.addEventListener("focus", () => seleccionarCelda(r, c));
              input.addEventListener("click", () => {
                if (celdaActivaKey === k) alternarDireccion(r, c);
                seleccionarCelda(r, c);
              });
              input.addEventListener("input", (e) => {
                e.target.value = e.target.value
                  .toUpperCase()
                  .replace(/[^A-ZÑ]/g, "");
                limpiarEstadoCelda(r, c);
                if (e.target.value) moverSiguiente(r, c);
                actualizarResueltos();
                verificarVictoria();
              });
              input.addEventListener("keydown", (e) => manejarTeclado(e, r, c));
            } else {
              div.className = "celda";
            }
            gridEl.appendChild(div);
          }
        }
      }

      function renderClues() {
        const listaH = document.getElementById("lista-h");
        const listaV = document.getElementById("lista-v");
        listaH.innerHTML = "";
        listaV.innerHTML = "";

        function construirLista(lista, cont) {
          lista.forEach((w) => {
            const div = document.createElement("div");
            div.className = "clue-item";
            div.id = "clue-" + w.dir + w.num;
            div.innerHTML = `<b>${w.num}.</b> ${w.pista} <span style="color:#999">(${w.len})</span>`;
            div.onclick = () => irAPalabra(w);
            cont.appendChild(div);
          });
        }
        construirLista(DATA.clues_h, listaH);
        construirLista(DATA.clues_v, listaV);
      }

      function limpiarEstadoCelda(r, c) {
        const k = clave(r, c);
        const div = inputs[k].parentElement;
        div.classList.remove("correcta", "incorrecta");
      }

      function palabraEn(r, c, dir) {
        const k = clave(r, c);
        return (indice[k] && indice[k][dir]) || null;
      }

      function seleccionarCelda(r, c) {
        const k = clave(r, c);
        celdaActivaKey = k;
        let w = palabraEn(r, c, direccionActual);
        if (!w) {
          direccionActual = direccionActual === "H" ? "V" : "H";
          w = palabraEn(r, c, direccionActual);
        }
        palabraActual = w;
        window.palabraActual = w;
        pintarSeleccion(r, c);
        mostrarClueBanner();
      }

      function alternarDireccion(r, c) {
        const otra = direccionActual === "H" ? "V" : "H";
        if (palabraEn(r, c, otra)) {
          direccionActual = otra;
        }
      }

      function pintarSeleccion(rFoco, cFoco) {
        document
          .querySelectorAll(".celda.activa, .celda.foco")
          .forEach((el) => el.classList.remove("activa", "foco"));
        document
          .querySelectorAll(".clue-item.seleccionado")
          .forEach((el) => el.classList.remove("seleccionado"));
        if (palabraActual) {
          palabraActual.celdas.forEach(([r, c]) => {
            const inp = inputs[clave(r, c)];
            if (inp) inp.parentElement.classList.add("activa");
          });
          const item = document.getElementById(
            "clue-" + palabraActual.dir + palabraActual.num,
          );
          if (item) item.classList.add("seleccionado");
        }
        const focoInp = inputs[clave(rFoco, cFoco)];
        if (focoInp) focoInp.parentElement.classList.add("foco");
      }

      function mostrarClueBanner() {
        const banner = document.getElementById("clue-banner");
        if (!palabraActual) {
          banner.textContent = "Toque una casilla o una pista para comenzar";
          return;
        }
        const flecha = palabraActual.dir === "H" ? "→" : "↓";
        banner.innerHTML = `<b>${palabraActual.num} ${flecha}</b> &nbsp; ${palabraActual.pista} &nbsp; <span style="color:#999">(${palabraActual.len} letras)</span>`;
      }

      function moverSiguiente(r, c) {
        if (!palabraActual) return;
        const idx = palabraActual.celdas.findIndex(
          ([rr, cc]) => rr === r && cc === c,
        );
        if (idx >= 0 && idx < palabraActual.celdas.length - 1) {
          const [nr, nc] = palabraActual.celdas[idx + 1];
          const inp = inputs[clave(nr, nc)];
          if (inp) inp.focus();
        }
      }

      function moverAnterior(r, c) {
        if (!palabraActual) return;
        const idx = palabraActual.celdas.findIndex(
          ([rr, cc]) => rr === r && cc === c,
        );
        if (idx > 0) {
          const [pr, pc] = palabraActual.celdas[idx - 1];
          const inp = inputs[clave(pr, pc)];
          if (inp) inp.focus();
        }
      }

      function manejarTeclado(e, r, c) {
        const k = clave(r, c);
        const esLetra = e.key.length === 1 && /^[a-zA-ZñÑ]$/.test(e.key);
        if (esLetra) {
          // Se maneja aquí directamente (en vez de esperar el evento 'input') porque
          // al sobrescribir una casilla que ya tiene una letra, el límite de 1
          // carácter del cuadro a veces bloquea el reemplazo y el evento 'input'
          // no llega a dispararse, dejando la letra sin avanzar a la siguiente casilla.
          e.preventDefault();
          const inp = inputs[k];
          inp.value = e.key.toUpperCase();
          limpiarEstadoCelda(r, c);
          moverSiguiente(r, c);
          actualizarResueltos();
          verificarVictoria();
          return;
        }
        if (e.key === "Backspace") {
          if (!inputs[k].value) {
            e.preventDefault();
            moverAnterior(r, c);
            const idx = palabraActual.celdas.findIndex(
              ([rr, cc]) => rr === r && cc === c,
            );
            if (idx > 0) {
              const [pr, pc] = palabraActual.celdas[idx - 1];
              inputs[clave(pr, pc)].value = "";
              limpiarEstadoCelda(pr, pc);
            }
          }
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          const inp = inputs[clave(r, c + 1)];
          if (inp) {
            direccionActual = "H";
            inp.focus();
          }
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          const inp = inputs[clave(r, c - 1)];
          if (inp) {
            direccionActual = "H";
            inp.focus();
          }
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          const inp = inputs[clave(r + 1, c)];
          if (inp) {
            direccionActual = "V";
            inp.focus();
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          const inp = inputs[clave(r - 1, c)];
          if (inp) {
            direccionActual = "V";
            inp.focus();
          }
        }
      }

      function irAPalabra(w) {
        direccionActual = w.dir;
        const [r, c] = w.celdas[0];
        inputs[clave(r, c)].focus();
      }

      function actualizarResueltos() {
        todasPalabras.forEach((w) => {
          const completa = w.celdas.every(([r, c]) => {
            const inp = inputs[clave(r, c)];
            return inp && inp.value === DATA.grid[clave(r, c)];
          });
          const item = document.getElementById("clue-" + w.dir + w.num);
          if (item) item.classList.toggle("resuelto", completa);
        });
      }

      function revisarTodo() {
        Object.keys(inputs).forEach((k) => {
          const inp = inputs[k];
          const div = inp.parentElement;
          div.classList.remove("correcta", "incorrecta");
          if (!inp.value) return;
          if (inp.value === DATA.grid[k]) {
            div.classList.add("correcta");
          } else {
            div.classList.add("incorrecta");
          }
        });
        actualizarResueltos();
        verificarVictoria();
      }

      function darPista() {
        let w = palabraActual;
        if (!w) {
          w = todasPalabras.find((w) =>
            w.celdas.some(
              ([r, c]) => inputs[clave(r, c)].value !== DATA.grid[clave(r, c)],
            ),
          );
          if (!w) return;
        }
        const vacia = w.celdas.find(
          ([r, c]) => inputs[clave(r, c)].value !== DATA.grid[clave(r, c)],
        );
        if (vacia) {
          const [r, c] = vacia;
          const k = clave(r, c);
          inputs[k].value = DATA.grid[k];
          inputs[k].parentElement.classList.remove("incorrecta");
          inputs[k].parentElement.classList.add("correcta");
        }
        actualizarResueltos();
        verificarVictoria();
      }

      function verificarVictoria() {
        const completo = Object.keys(DATA.grid).every(
          (k) => inputs[k] && inputs[k].value === DATA.grid[k],
        );
        document.getElementById("resultado").classList.toggle("show", completo);
        if (completo) {
          document
            .getElementById("resultado")
            .scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      function reiniciar() {
        Object.values(inputs).forEach((inp) => {
          inp.value = "";
          inp.parentElement.classList.remove("correcta", "incorrecta");
        });
        document
          .querySelectorAll(".clue-item.resuelto")
          .forEach((el) => el.classList.remove("resuelto"));
        document.getElementById("resultado").classList.remove("show");
        palabraActual = null;
        document.getElementById("clue-banner").textContent =
          "Toque una casilla o una pista para comenzar";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function generarPuzzleNuevo() {
        const boton = document.getElementById("btn-nuevo-puzzle");
        boton.disabled = true;
        boton.textContent = "Generando...";
        setTimeout(() => {
          const nuevaData = generarCrucigrama();
          iniciarJuego(nuevaData);
          boton.disabled = false;
          boton.textContent = "Generar puzzle nuevo";
        }, 10);
      }

      /* iniciar con el puzzle curado */
      iniciarJuego(DATA_INICIAL);
    </script>
